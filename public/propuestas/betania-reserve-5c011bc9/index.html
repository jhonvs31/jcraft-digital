<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propuesta de marca y contenido · Betania Reserve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Fraunces:ital,wght@0,300;1,300&family=Manrope:wght@400;600;700&display=swap">
<style>
  :root{--bg:#F6EEE2;--ink:#2B2A1A;--muted:#6E7158;--oro:#9C6B2F;--line:rgba(43,42,26,.2)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;padding:24px 16px}
  main{width:100%;max-width:420px;display:grid;gap:22px}
  .brand{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:14px;font-weight:600}
  .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--oro)}
  h1{font-family:'Fraunces','Times New Roman',serif;font-weight:300;font-size:44px;line-height:1.05;margin:0}
  h1 i{color:var(--oro)}
  p{margin:0;color:var(--muted);line-height:1.6}
  form{display:grid;gap:12px;margin-top:6px}
  label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  input{font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);background:#fbf6ee;color:var(--ink);border-radius:10px}
  input:focus{outline:2px solid var(--oro);outline-offset:2px}
  button{font:700 13px/1 'Manrope',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:17px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #msg{min-height:1.6em;font-size:14px;color:#8C2B24}
  small{font-size:12px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <div class="brand">BETANIA · RESERVE</div>
  <div class="eyebrow">Propuesta privada · JCraft</div>
  <h1>Un café de familia,<br>contado con <i>alma.</i></h1>
  <p>Esta página es solo para ustedes. Escriban la contraseña que les enviamos para ver la propuesta de marca y contenido.</p>
  <form id="gate">
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Ver la propuesta</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
  <small>© JCraft Digital · Piezas de muestra, no autorizadas para publicarse.</small>
</main>
<script src="gate.js"></script>
</body>
</html>
